#  1. WORKFLOW (Metadata & Triggers)
#    └── 2. JOBS (The list of machines to boot up (e.g test-and-lint, build-and-deploy))
#         └── 3. TARGET RUNNER & RULES (What machine (runs-on), what dependencies (needs), and what environment variables (env) to set)
#              └── 4. STEPS (The sequential list of tasks on that machine)

name : "CI/CD Pipeline"

on: {push : {branches:["main"]}}

jobs:
  test-and-lint:
    runs-on : ubuntu-latest
    steps :
      -name : "Checkout Code"
       uses : actions/checkout@v4

      -name : "Set up Python"
       uses : actions/setup-python@v4
       with : {python-version: "3.13", cache: "pip"}
       
      -name: "Install Dependencies"
       run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      -name: "Run Tests"
       run: |
          pytest tests/

  build-and-deploy:
    runs-on: ubuntu-latest
    needs : test-and-lint
    steps :
      -name : "Checkout Code"
       uses : actions/checkout@v4

      -name : "Set up Python"
       uses : actions/setup-python@v4
       with : {python-version: "3.13", cache: "pip"}
      
      -name: "Login to DOCKER HUB"
       uses: docker/login-action@v2
       with : 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      -name: "Build Docker Image"
       uses: docker/build-push-action@v5
       with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fault-detector:latest

    