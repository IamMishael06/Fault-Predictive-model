#  1. WORKFLOW (Metadata & Triggers)
#    └── 2. JOBS (The list of machines to boot up (e.g test-and-lint, build-and-deploy))
#         └── 3. TARGET RUNNER & RULES (What machine (runs-on), what dependencies (needs), and what environment variables (env) to set)
#              └── 4. STEPS (The sequential list of tasks on that machine)

name: "CI/CD Pipeline"

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:

  # JOB 1: TEST AND LINT
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "api/requirement.txt"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest flake8

      - name: "Run Tests"
        env:
          PYTHONPATH: api
        run: |
          python -m pytest tests/ -v

      - name: "Check Python Errors"
        run: |
          flake8 api/ --select=E9,F63,F7,F82 --show-source --statistics


  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  build-and-push:
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Login to Docker Hub"
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build and Push Docker Image"
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fault-detector:latest
